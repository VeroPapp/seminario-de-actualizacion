<body>
    
    <h1>Ejercicio 6</h1>
    <p>Json de circulo: <br> {"type": "circle", "x": 300, "y": 200, "radius": 80}</p>
    <p>Json de poligono: <br> {"type": "polygon", "x": 500, "y": 350, "points": [{ "x": 0, "y": -80 }, { "x": 70, "y": 50 }, { "x": -70, "y": 50 }]}</p>

    <script src="MVCCanvas.js"></script>

    <script>

        function main() {

            const model = new Model();
            const view = new View();
            const controller = new Controller(view, model);

            controller.enable();

            document.body.appendChild(view);
        }

        window.onload = main;
    </script>
