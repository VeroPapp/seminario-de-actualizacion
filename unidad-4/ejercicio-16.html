<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 16 - Círculo coloreado gradial</title>
</head>

<body>

</body>

<script>

    class Model extends EventTarget {
        constructor() {
            super();
            this._radius = 150;
            this._centerColor = '#ffffff';
            this._edgeColor = '#3498db';
        }

        get radius() { 
            return this._radius;
        }

        get centerColor() { 
            return this._centerColor; 
        }

        get edgeColor()   { 
            return this._edgeColor; 
        }

        changed() {
            this.dispatchEvent(new CustomEvent('changed'));
        }
    }


    class View extends HTMLElement {
        constructor() {
            super();
            this._canvas = document.createElement('canvas');
            this._canvas.width = 800;
            this._canvas.height = 600;
            this._canvas.style.border = '1px solid black';
            this._ctx = this._canvas.getContext('2d');
            this.appendChild(this._canvas);
        }

        drawCircle(radius, centerColor, edgeColor) {
            const x = this._canvas.width / 2;
            const y = this._canvas.height / 2;
            
            this._ctx.clearRect(0, 0, this._canvas.width, this._canvas.height);

            const gradient = this._ctx.createRadialGradient(x, y, 0, x, y, radius);

            gradient.addColorStop(0, centerColor);
            gradient.addColorStop(1, edgeColor);

            this._ctx.beginPath();
            this._ctx.arc(x, y, radius, 0, Math.PI * 2);
            this._ctx.fillStyle = gradient;
            this._ctx.fill();
        }
    }

    customElements.define('x-view', View);


    class Controller {
        constructor(view, model) {
            this._view = view;
            this._model = model;
            this._onModelChanged = this.onModelChanged.bind(this);
            this._onViewRequest  = this.onViewRequest.bind(this);
        }

        enable() {
            this._model.addEventListener('changed', this._onModelChanged);
            this._view.addEventListener('request', this._onViewRequest);

            this.onModelChanged();
        }

        disable() {
            this._model.removeEventListener('changed', this._onModelChanged);
            this._view.removeEventListener('request', this._onViewRequest);
        }

        onModelChanged() {
            this._view.drawCircle(this._model.radius, this._model.centerColor, this._model.edgeColor);
        }

        onViewRequest(event) {

        }
    }

    function main() {
        const myModel = new Model();
        const myView = new View();
        const myController = new Controller(myView, myModel);

        myController.enable();

        document.body.appendChild(myView);

    }

    window.onload = main;

</script>

</html>
