<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Triángulo</title>
</head>

<body>

</body>

<script>

    class Model extends EventTarget {
        constructor() {
            super();
            this._base = 200;
            this._height = 150;
        }

        get base() {
            return this._base;
        }

        get height() {
            return this._height;
        }

        changed() {
            this.dispatchEvent(new CustomEvent('changed'));
        }
    }


    class View extends HTMLElement {
        constructor() {
            super();
            this._canvas = document.createElement('canvas');
            this._canvas.width = 800;
            this._canvas.height = 600;
            this._canvas.style.border = '1px solid black';
            
            this._ctx = this._canvas.getContext('2d');

            this.appendChild(this._canvas);

        }
        
        drawTriangle(base, height){
            let centerX = this._canvas.width / 2;
            let centerY = this._canvas.height / 2;

            let p1 = {
                x: centerX,
                y: centerY - height / 2
            };

            let p2 = {
                x: centerX - base / 2,
                y: centerY + height / 2
            };

            let p3 = {
                x: centerX + base / 2,
                y: centerY + height / 2
            };

            this._ctx.beginPath();
                this._ctx.moveTo(p1.x, p1.y);
                this._ctx.lineTo(p2.x, p2.y);
                this._ctx.lineTo(p3.x, p3.y);
            this._ctx.closePath();

            this._ctx.stroke();
        };


        connectedCallback() {

        }

        disconnectedCallback() {
            
        }
        
    }
    customElements.define('x-view', View);


    class Controller {
        constructor(view, model) {
            this._view = view;
            this._model = model;

            this._onModelChanged = this.onModelChanged.bind(this);
            this._onViewRequest = this.onViewRequest.bind(this);
        }
        
        enable() {
            this._model.addEventListener('changed', this._onModelChanged);
            this._view.addEventListener('request', this._onViewRequest);

            this._view.drawTriangle(this._model.base, this._model.height);
        }
        
        disable() {
            this._model.removeEventListener('changed', this._onModelChanged);
            this._view.removeEventListener('request', this._onViewRequest);
        }
        
        onModelChanged() {
            this._view.drawTriangle(this._model.base, this._model.height);
            
        }
        
        onViewRequest(event) {
        
        }
    }


    function main() {
        let myModel = new Model();
        let myView = new View();
        let myController = new Controller(myView, myModel);
        
        myController.enable();
        
        document.body.appendChild(myView);
    }
    
    window.onload = main;

</script>

</html>
